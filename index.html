<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>NewsFlash · News Website</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="CSS/style.css">
</head>
<body>

<!-- HEADER -->
<div class="site-header">
  <div class="container header-flex">
    <div class="logo-area" id="homeLogo">
      <div class="logo-icon"><i class="fas fa-newspaper"></i></div>
      <div class="logo-text">
        <h1>NewsFlash</h1>
        <span>daily news · fresh updates</span>
      </div>
    </div>
    <div class="date-badge"><i class="far fa-calendar-alt"></i><span id="liveDate"></span></div>
    <div class="user-menu">
      <button id="loginBtn" class="login-btn"><i class="fas fa-user"></i> Login</button>
      <div id="userDropdown" class="user-dropdown">
        <span id="userNameDisplay" class="user-name"></span>
        <button id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</button>
      </div>
    </div>
  </div>
</div>

<div class="container">
  <!-- Search & Filters -->
  <div class="action-bar" id="actionBar">
    <div class="search-wrapper">
      <i class="fas fa-search"></i>
      <input type="text" id="searchInput" placeholder="Search news...">
      <button id="clearSearchBtn"><i class="fas fa-times-circle"></i></button>
    </div>
    <button id="resetAllBtn" class="reset-filters-btn"><i class="fas fa-sliders-h"></i> Reset filters</button>
  </div>

  <div id="categoriesWrap">
    <div id="categoryContainer" class="cat-buttons"></div>
  </div>

  <!-- Ad Banner Top -->
  <div class="ad-container">
    <div style="text-align: center; width: 100%;">
      <div class="ad-label">— Advertisement —</div>
      <script>
        atOptions = {
          'key' : 'ca3013086a4b100db14a5daddf891044',
          'format' : 'iframe',
          'height' : 90,
          'width' : 728,
          'params' : {}
        };
      </script>
      <script src="https://www.highperformanceformat.com/ca3013086a4b100db14a5daddf891044/invoke.js"></script>
    </div>
  </div>

  <!-- News Grid -->
  <div id="newsGridContainer" class="news-grid"></div>

  <!-- Ad Banner Bottom -->
  <div class="ad-container">
    <div style="text-align: center; width: 100%;">
      <div class="ad-label">— Advertisement —</div>
      <script>
        atOptions = {
          'key' : 'ca3013086a4b100db14a5daddf891044',
          'format' : 'iframe',
          'height' : 90,
          'width' : 728,
          'params' : {}
        };
      </script>
      <script src="https://www.highperformanceformat.com/ca3013086a4b100db14a5daddf891044/invoke.js"></script>
    </div>
  </div>

  <!-- Full Article Page -->
  <div id="fullArticlePage" class="full-article-page">
    <button class="back-to-news" id="backToNewsBtn"><i class="fas fa-arrow-left"></i> Back to all news</button>
    <img id="fullArticleImage" src="" alt="">
    <h1 id="fullArticleTitle"></h1>
    <div class="full-article-meta">
      <span id="fullArticleCategory"></span>
      <span id="fullArticleDate"></span>
    </div>
    <div id="fullArticleContent" class="full-article-content"></div>
    <div class="related-articles">
      <h3><i class="fas fa-random"></i> You May Also Like</h3>
      <div id="relatedArticlesContainer" class="related-grid"></div>
    </div>
  </div>
</div>

<!-- FOOTER -->
<footer>
  <div class="container">
    <p><i class="fas fa-ad"></i> Advertisements support our free news service</p>
    <p style="margin-top: 8px;">© 2025 NewsFlash — Stay informed, stay ahead</p>
  </div>
</footer>

<!-- Login Modal -->
<div id="loginModal" class="modal-login">
  <div class="modal-login-content">
    <span class="close-login">&times;</span>
    <div class="login-tabs">
      <button class="tab-btn active" data-tab="login">Login</button>
      <button class="tab-btn" data-tab="signup">Sign Up</button>
    </div>
    <div id="loginForm" class="login-form active">
      <h3>Welcome Back</h3>
      <input type="email" id="loginEmail" placeholder="Email">
      <input type="password" id="loginPassword" placeholder="Password">
      <button id="submitLoginBtn">Login</button>
      <p class="form-message" id="loginMessage"></p>
    </div>
    <div id="signupForm" class="login-form">
      <h3>Create Account</h3>
      <input type="text" id="signupName" placeholder="Full Name">
      <input type="email" id="signupEmail" placeholder="Email">
      <input type="password" id="signupPassword" placeholder="Password (min 6)">
      <input type="password" id="signupConfirm" placeholder="Confirm Password">
      <button id="submitSignupBtn">Sign Up</button>
      <p class="form-message" id="signupMessage"></p>
    </div>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
